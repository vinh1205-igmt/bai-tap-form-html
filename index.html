<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS flex-flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>1. flex-flow: row nowrap (Mặc định)</h2>
    <div class="container-1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <hr style="margin: 30px 0;">

    <h2>2. flex-flow: row-reverse nowrap (Đảo ngược hàng)</h2>
    <div class="container-2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

</body>
</html>
