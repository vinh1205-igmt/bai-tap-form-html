<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Bootstrap Forms</title>
    <!-- Nhúng Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- Container chính căn giữa Form trên màn hình -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Thẻ Card bao bọc Form -->
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Tiêu đề Form -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary">Tạo Tài Khoản</h2>
                            <p class="text-muted">Vui lòng điền đầy đủ thông tin bên dưới để đăng ký</p>
                        </div>

                        <!-- Form Đăng Ký -->
                        <form action="#" method="POST">
                            
                            <!-- 1. Họ và tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" placeholder="Nhập họ và tên của bạn" required>
                            </div>

                            <!-- 2. Email -->
                            <div class="mb-3">
                                <label for="emailInput" class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                                <div class="form-text text-muted">Chúng tôi cam kết bảo mật thông tin email của bạn.</div>
                            </div>

                            <!-- 3. Mật khẩu & Xác nhận mật khẩu (Chia 2 cột trên Desktop/Tablet) -->
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-sm-6">
                                    <label for="passwordInput" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="passwordInput" placeholder="Tối thiểu 8 ký tự" required>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label for="confirmPasswordInput" class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Nhập lại mật khẩu" required>
                                </div>
                            </div>

                            <!-- 4. Giới tính (Radio buttons) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- 5. Sở thích (Checkboxes) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
                                    <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                    <label class="form-check-label" for="hobbySports">Thể thao</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                    <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                    <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                                </div>
                            </div>

                            <!-- 6. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="countrySelect" class="form-label fw-semibold">Quốc gia <span class="text-danger">*</span></label>
                                <select class="form-select" id="countrySelect" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Mỹ (United States)</option>
                                    <option value="JP">Nhật Bản</option>
                                    <option value="KR">Hàn Quốc</option>
                                    <option value="SGP">Singapore</option>
                                </select>
                            </div>

                            <!-- 7. Điều khoản dịch vụ -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                                <label class="form-check-label text-muted small" for="agreeTerms">
                                    Tôi đồng ý với <a href="#" class="text-primary text-decoration-none">Điều khoản & Chính sách</a> dịch vụ.
                                </label>
                            </div>

                            <!-- 8. Nút Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Đăng Ký Ngay</button>
                            </div>

                        </form>

                        <!-- Đăng nhập link -->
                        <div class="text-center mt-4">
                            <p class="text-muted mb-0 small">
                                Đã có tài khoản? <a href="#" class="text-primary fw-semibold text-decoration-none">Đăng nhập ngay</a>
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
